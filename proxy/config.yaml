# Qwen3.8 compaction proxy configuration.
#
# Phase 0 is passthrough only. Watermark / mode plumbing exists so Phase 1
# can plug in compaction without a config break.

# Address the proxy listens on. See docs/compaction-strategy.md.
listen:
  host: "127.0.0.1"
  port: 11500

# Upstream llama-server (turboquant primary). Default matches scripts/start-turboquant.sh.
upstream:
  base_url: "http://127.0.0.1:10501"
  # Timeout for non-streaming upstream calls (ms). Streams have no timeout.
  request_timeout_ms: 600000

# Operational mode:
#   passthrough — never rewrite, never compact (still answers phantom expand calls).
#   shadow      — compute the rewrite, log it, forward the ORIGINAL upstream.
#   enforce     — compute the rewrite, forward the REWRITTEN body upstream.
# `x-compact: off` request header bypasses everything in any mode.
mode: "passthrough"

# Watermarks. Tier 0 verbatim window + Tier 1 elision read these.
watermarks:
  # Fraction of n_ctx that triggers compaction (used by future tiers).
  prompt_fraction: 0.70
  # Single tool result above this many tokens always gets elided (Tier 1).
  tool_result_min_tokens: 2000
  # Fallback message-count / age trigger (used by future tiers).
  max_messages: 40
  max_age_turns: 20
  # Tier 0 verbatim window (whichever is larger keeps more).
  verbatim_keep_turns: 8
  verbatim_keep_tokens: 8000

# On-disk state. JSONL request logs and (later) cached artifacts live here.
cache_dir: "~/.cache/qwen-compact"

# Token-count LRU cache.
tokenizer:
  cache_entries: 4096

# pino log level for the process logger (stdout). Per-request JSONL is separate.
log_level: "info"

# Phase 2 recursive summarizer (Tier 3). The same Qwen3.8 server can summarize
# before the proxy forwards the rewritten request, so no sidecar model exists.
#   off|passthrough — never call (default).
#   shadow          — call and log; do NOT replace the tool-result body.
#   enforce         — replace oversized tool-result bodies with the summary
#                     before Tier 1 sees them. Falls through to Tier 1 stub
#                     on any summarizer error (offline, timeout, bad JSON).
summarizer:
  url: ""
  mode: "off"
  request_timeout_ms: 8000
  max_tokens: 512
  model: "qwen3.8-local"

# Phase 3 — KV stable-prefix discipline + session keying.
# When `enabled: false` (default) the proxy is byte-identical to Phase 0/1/2.
# When enabled, a stable session key is derived per request and attached to
# the JSONL log. `slot_endpoint_base` is reserved for the future wire-up to
# llama.cpp `/slots/<id>/save` and `/slots/<id>/restore`; empty string keeps
# slot integration stubbed.
session:
  enabled: false
  ttl_seconds: 3600
  slot_endpoint_base: ""
  key_header: "x-session-id"

# Phase 4 — structured notes (Tier-2/3). Off by default. Heuristic entity /
# key=value / decision-marker extraction on oversized tool-result bodies the
# Phase 2 summarizer didn't compress. Replaces the body with a
# `<tool_result_notes>` envelope so Tier 1 won't re-stub it.
notes:
  enabled: false
  min_tokens_to_extract: 200

# Phase 5 — sumy fallback (Tier-4). Off by default. Inline extractive summary
# (no external dep) for oversized tool-result bodies that have neither been
# summarized (Phase 2) nor yielded any notes.
sumy:
  enabled: false
  target_sentences: 5

# Phase 6 — hook engine + middleware (docs/hooks-middleware.md v0.2). Off by
# default. When disabled or `handlers:` empty, request flow is byte-identical.
# Each handler entry: { handler: "built-in:<id>" | "./relative.js#export",
#                       phase, priority?, timeout_ms?, filter?, config? }
hooks:
  enabled: false
  default_timeout_ms: 50
  handlers: []
